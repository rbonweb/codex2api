name: Security Scan

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
      - codex/**
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      # PRs and pushes pin the scanner version so the tool itself does not drift. The vulnerability database is still live.
      # The Monday scheduled run uses @latest to catch new advisories.
      - name: Run govulncheck
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          else
            go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          fi
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        # Equivalent to npm audit --omit=dev --audit-level=high, plus a per-advisory exception allowlist
        # (the reason and review date are recorded in the script).
        run: node scripts/audit-gate.mjs
