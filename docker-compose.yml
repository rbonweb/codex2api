# Gateway only. Point it at an external database through .env:
#   - PostgreSQL such as Neon: DATABASE_URL=postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
#   - SQLite on the data volume: DATABASE_DRIVER=sqlite and DATABASE_PATH=/data/codex2api.db
# Without Redis, set CACHE_DRIVER=memory (or point REDIS_ADDR at an external Redis).
# For a bundled PostgreSQL and Redis, use docker-compose.full.yml instead.
name: codex2api

services:
  codex2api:
    image: ghcr.io/rbonweb/codex2api:latest
    container_name: codex2api
    ports:
      - "${BIND_HOST:-0.0.0.0}:${CODEX_PORT:-8080}:${CODEX_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - codex2api-data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${CODEX_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  codex2api-data:
    name: codex2api_data
